<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  padding-top: 12px;
  padding-bottom: 12px;
  padding-left: 12px;
  padding-right: 12px;
  width: 600px;
  border-radius: 6px;
}

.profile-picture {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 25px;
  vertical-align: middle;
  margin-right: 5px;
}

.text-box {
  font-size: 18px;
  border: none;
  width: 300px;
  margin-left: 50px;

}

.tweet {
  background-color: rgb(29, 155, 240);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  margin-left: 100px;
}
    </style>
</head>
  <body>
    <div class="card">
      <img class="profile-picture" src="cat.jpg">
      <input type="text" class="text-box" placeholder="What's happening?">
      <button class="tweet">
        Tweet
      </button>
    </div>
  </body>
</html>
</html>
